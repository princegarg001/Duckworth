name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (a git SHA). Leave blank for HEAD.'
        required: false

concurrency:
  # Never two deploys at once, and never cancel one midway — a half-applied
  # migration is worse than a queued deploy.
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy-web.outputs.url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve the image tag
        id: tag
        run: echo "sha=${{ inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"

      # A single service-principal credential, not a personal login. Created
      # once with:
      #   az ad sp create-for-rbac --name ipl-cd --role contributor \
      #     --scopes /subscriptions/<sub-id>/resourceGroups/ipl-platform \
      #     --sdk-auth
      # and stored as the AZURE_CREDENTIALS repository secret. Scoped to one
      # resource group, not the subscription, so a leaked credential cannot
      # touch anything outside this project.
      - name: Authenticate to Azure
        uses: azure/login@6c251865b4e6290e7b78be643ea2d005bc51f69a # v2.2.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Log Docker in to the registry
        run: |
          az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      # ── 1. Build and push ────────────────────────────────────────────────
      #
      # `az acr build` (ACR Tasks) is unavailable on Azure for Students
      # subscriptions, so CI builds locally, exactly as scripts/deploy-azure.sh
      # does, and pushes with `docker push`.
      - name: Build and push api and ingest
        run: |
          set -euo pipefail
          for svc in api ingest; do
            docker buildx build --platform linux/amd64 \
              -f "apps/${svc}/Dockerfile" \
              -t "${{ vars.AZURE_ACR_LOGIN_SERVER }}/${svc}:${{ steps.tag.outputs.sha }}" \
              --cache-from "type=gha,scope=cd-${svc}" \
              --cache-to "type=gha,mode=max,scope=cd-${svc}" \
              --push .
          done

      # ── 2. Migrate, behind its own gate ─────────────────────────────────
      #
      # A separate, blocking step before any new code serves traffic. It runs
      # the same `ingest all` the compose file and the Helm hook run, so it
      # re-verifies the 23 data-quality checks and fails the deploy if the
      # data no longer reconciles.
      #
      # Migrations are expand-then-contract: add a column, backfill it, switch
      # reads, and drop the old one in a *later* release. A destructive change
      # in the same deploy that starts using it cannot be rolled back — see
      # docs/runbook.md.
      - name: Run migrations and verify data
        run: |
          set -euo pipefail
          az containerapp job update \
            --name ipl-ingest --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_ACR_LOGIN_SERVER }}/ingest:${{ steps.tag.outputs.sha }}"

          EXEC_NAME=$(az containerapp job start \
            --name ipl-ingest --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query name -o tsv)

          for i in $(seq 1 90); do
            STATUS=$(az containerapp job execution show \
              --name ipl-ingest --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --job-execution-name "$EXEC_NAME" --query 'properties.status' -o tsv)
            case "$STATUS" in
              Succeeded) echo "ingest succeeded"; break ;;
              Failed|Degraded)
                az containerapp job logs show \
                  --name ipl-ingest --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                  --container ipl-ingest --tail 100 || true
                echo "::error::ingest failed — a data-quality check likely did not pass"
                exit 1 ;;
              *) sleep 10 ;;
            esac
            [ "$i" = 90 ] && { echo "::error::ingest timed out"; exit 1; }
          done

      # ── 3. API ───────────────────────────────────────────────────────────
      # Container Apps has no native traffic-split promotion step the way
      # Cloud Run does; `containerapp update` replaces the active revision
      # directly. The smoke test below is what stands in for the canary.
      - name: Deploy the API
        run: |
          az containerapp update \
            --name ipl-api --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_ACR_LOGIN_SERVER }}/api:${{ steps.tag.outputs.sha }}" \
            --set-env-vars "GIT_SHA=${{ steps.tag.outputs.sha }}" "SERVICE_VERSION=${{ steps.tag.outputs.sha }}"

      - name: Smoke test the API
        run: |
          set -euo pipefail
          API_URL=$(az containerapp show --name ipl-api \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          API_URL="https://${API_URL}"

          # Readiness must be genuinely ok — not merely reachable. It reports
          # migration state, mart freshness and data-quality failures, so this
          # single check catches a deploy against a database that did not
          # migrate or data that did not reconcile.
          body=$(curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "${API_URL}/health/ready")
          echo "$body"
          echo "$body" | grep -q '"status":"ok"' || { echo "::error::API is not ready"; exit 1; }

          curl -fsS "${API_URL}/v1/seasons/2022/points-table" \
            | grep -q '"netRunRate":0.316' || {
              echo "::error::Points table does not match the published standings"; exit 1;
            }

      # ── 4. Web ───────────────────────────────────────────────────────────
      # Built only now: Next inlines NEXT_PUBLIC_API_URL at build time and the
      # API's hostname does not exist until Container Apps has provisioned it.
      - name: Build and push web against the live API URL
        run: |
          set -euo pipefail
          API_URL=$(az containerapp show --name ipl-api \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          docker buildx build --platform linux/amd64 \
            -f apps/web/Dockerfile \
            --build-arg "NEXT_PUBLIC_API_URL=https://${API_URL}" \
            -t "${{ vars.AZURE_ACR_LOGIN_SERVER }}/web:${{ steps.tag.outputs.sha }}" \
            --cache-from "type=gha,scope=cd-web" \
            --cache-to "type=gha,mode=max,scope=cd-web" \
            --push .

      - name: Deploy web
        id: deploy-web
        run: |
          az containerapp update \
            --name ipl-web --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_ACR_LOGIN_SERVER }}/web:${{ steps.tag.outputs.sha }}"
          WEB_URL=$(az containerapp show --name ipl-web \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "url=https://${WEB_URL}" >> "$GITHUB_OUTPUT"

      - name: Roll back on failure
        if: failure()
        run: |
          echo "::warning::Deploy failed. Container Apps keeps prior revisions; the previous"
          echo "::warning::image tag can be redeployed with: az containerapp update --name ipl-api --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} --image <previous-image>"
