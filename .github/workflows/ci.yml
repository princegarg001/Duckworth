name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref: a force-push should not leave three
# builds competing for runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ── Static analysis ───────────────────────────────────────────────────────
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test:unit
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        if: always()
        with:
          name: coverage
          path: '**/coverage/**'
          retention-days: 7

  # ── The contract gate ─────────────────────────────────────────────────────
  #
  # Regenerates the OpenAPI document from the Zod schemas and fails if it
  # differs from what is committed. Because the frontend's types are generated
  # from that same file, a breaking API change fails the build in the pull
  # request that introduced it rather than in production.
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@ipl/api^...

      - name: Regenerate the OpenAPI document
        run: pnpm --filter @ipl/api openapi:emit

      - name: Fail on drift
        run: |
          if ! git diff --quiet -- packages/contracts/openapi.json; then
            echo "::error::openapi.json is stale. Run 'make openapi' and commit the result."
            git diff -- packages/contracts/openapi.json | head -100
            exit 1
          fi
          echo "OpenAPI document matches the committed copy."

      - name: Lint the specification
        run: pnpm dlx @stoplight/spectral-cli@6 lint packages/contracts/openapi.json --ruleset .spectral.yaml

      - name: Regenerate the frontend client types
        run: |
          pnpm --filter @ipl/web gen:api
          if ! git diff --quiet -- apps/web/src/lib/api-types.ts; then
            echo "::error::Generated client types are stale. Run 'make openapi' and commit."
            exit 1
          fi

  # ── Integration: real Postgres, real migrations, real data ────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

      # The harness runs the real ingest CLI against the real dataset, and
      # data/raw is gitignored — 33MB of source JSON has no business in the
      # repository. `make data` is the same fetch the compose-smoke job below
      # uses, so both paths exercise identical bytes.
      - run: make data

      # Testcontainers starts its own Postgres, so there is no service block
      # here: the tests own their database lifecycle and run identically on a
      # laptop and on a runner.
      - run: pnpm turbo run test:integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  # ── Security ──────────────────────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # gitleaks needs history to scan it

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  # ── Images ────────────────────────────────────────────────────────────────
  build-images:
    name: Build & scan images
    runs-on: ubuntu-latest
    needs: [lint, unit]
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing via OIDC
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, ingest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      # GHCR requires an all-lowercase path. `github.repository` is
      # case-sensitive and matches the repo's actual name on GitHub — this
      # repository capitalises "Duckworth" — so it cannot be used in an image
      # tag directly.
      - name: Compute a lowercase image repository
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          # Push only on main; a pull request builds to verify, not to publish.
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true

      # aquasecurity/trivy-action wraps the CLI in a way that has shown a real
      # bug here: it reports exit code 1 (build failure) while the SARIF it
      # uploads in the very same invocation contains zero HIGH/CRITICAL
      # results — verified by pulling the exact image this step scanned and
      # running trivy directly against it, twice, on two trivy versions, both
      # clean. Running the CLI ourselves gives the same result the manual
      # verification did: the SARIF (all severities, for the Security tab)
      # and the pass/fail gate (HIGH/CRITICAL only) come from two explicit,
      # separately-reasoned invocations instead of one wrapper's internals.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0

      - name: Record vulnerabilities for the Security tab
        run: |
          trivy image --format sarif --output trivy-${{ matrix.service }}.sarif \
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.service }}:${{ github.sha }}

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Fail on fixable HIGH/CRITICAL vulnerabilities
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.service }}:${{ github.sha }}

      # Keyless signing: the signature is bound to this workflow's OIDC
      # identity, so there is no long-lived key to leak or rotate.
      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign the image
        if: github.event_name == 'push'
        run: cosign sign --yes ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.service }}:${{ github.sha }}

  # ── The clean-clone test ──────────────────────────────────────────────────
  #
  # The claim the README makes is that a fresh clone plus `make up` yields a
  # working app with data. This job is that claim, executed.
  compose-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fetch the dataset
        run: make data

      - name: Bring the stack up
        run: |
          cp .env.example .env
          docker compose up --build -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health/ready >/dev/null 2>&1; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "::error::API never became ready"
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Assert the data actually loaded
        run: |
          set -euo pipefail
          # The points table must be present and must match the published
          # standings — the same assertion the ingest makes, re-checked through
          # the HTTP surface a reviewer would use.
          gt=$(curl -fsS 'http://localhost:3000/v1/seasons/2022/points-table' \
               | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; print(d[0]["team"]["shortName"], d[0]["points"], d[0]["netRunRate"])')
          echo "leader: $gt"
          [ "$gt" = "GT 20 0.316" ] || { echo "::error::points table wrong: $gt"; exit 1; }

          # --retry tolerates a brief connection reset right after the readiness
          # probe passes — the points-table query above is heavier than these,
          # and the runner's Docker network occasionally needs a moment.
          curl_retry() { curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "$1" >/dev/null; }
          curl_retry http://localhost:3000/openapi.json || curl_retry http://localhost:3000/docs/json
          curl_retry http://localhost:3001/
          echo "web, api and docs all responding"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Tear down
        if: always()
        run: docker compose down -v
