apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ipl.fullname" . }}-config
  labels:
    {{- include "ipl.labels" . | nindent 4 }}
data:
  # Non-sensitive configuration only. Anything secret arrives through the
  # ExternalSecret and is mounted as a separate `secretRef`, so a `kubectl get
  # configmap -o yaml` can never print a credential.
  NODE_ENV: production
  HOST: '0.0.0.0'
  PORT: {{ .Values.api.port | quote }}
  SERVICE_NAME: ipl-api
  SERVICE_VERSION: {{ .Chart.AppVersion | quote }}
  CORS_ORIGINS: {{ printf "https://%s" .Values.ingress.host | quote }}
  METRICS_ENABLED: 'true'
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  TRUST_PROXY: 'true'
  {{- range $key, $value := .Values.api.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ipl.serviceAccountName" . }}
  labels:
    {{- include "ipl.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application calls no Kubernetes API; mounting a token would hand an
# attacker a cluster credential for nothing.
automountServiceAccountToken: false
{{- end }}
{{- if .Values.externalSecrets.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ipl.fullname" . }}-secrets
  labels:
    {{- include "ipl.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "ipl.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.data }}
    - secretKey: {{ .key }}
      remoteRef:
        key: {{ .remoteKey }}
    {{- end }}
{{- end }}
