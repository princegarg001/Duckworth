{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ipl.fullname" . }}
  labels:
    {{- include "ipl.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Longest prefix first: the API paths must win over the web catch-all.
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "ipl.fullname" . }}-api
                port: { name: http }
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: {{ include "ipl.fullname" . }}-api
                port: { name: http }
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: {{ include "ipl.fullname" . }}-api
                port: { name: http }
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "ipl.fullname" . }}-api
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ipl.fullname" . }}-web
                port: { name: http }
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# Default-deny with an explicit allowlist.
#
# Ingress: only from the ingress controller's namespace and from within this
# release. Egress: DNS, Postgres, Redis, the collector — nothing else. A
# compromised pod cannot reach the metadata service or call out to the
# internet, which is the whole point.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ipl.fullname" . }}
  labels:
    {{- include "ipl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ipl.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              {{- include "ipl.selectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.api.port }} }
        - { protocol: TCP, port: {{ .Values.web.port }} }
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: {{ .Values.networkPolicy.postgresPort }} }
        - { protocol: TCP, port: {{ .Values.networkPolicy.redisPort }} }
        - { protocol: TCP, port: 4318 }
    # Allow the web tier to reach the API service.
    - to:
        - podSelector:
            matchLabels:
              {{- include "ipl.selectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.api.port }} }
{{- end }}
