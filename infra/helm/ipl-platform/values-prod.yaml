# Production overlay.
#
# Contains no secrets: every credential is referenced by name and resolved at
# runtime from Secret Manager through the ExternalSecrets operator.

api:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 65
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { memory: 1Gi }
  env:
    LOG_LEVEL: info
    CACHE_TTL_SECONDS: '120'
    RATE_LIMIT_MAX: '600'
    SHUTDOWN_TIMEOUT_MS: '15000'
    OTEL_ENABLED: 'true'

web:
  replicaCount: 3
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

ingress:
  enabled: true
  className: nginx
  host: ipl.example.com
  tls:
    enabled: true
    secretName: ipl-platform-tls

externalSecrets:
  enabled: true

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpread:
  enabled: true
  # In production an unschedulable pod is preferable to two replicas on one
  # node, which is not really two replicas.
  whenUnsatisfiable: DoNotSchedule
