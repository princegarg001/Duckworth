# Same registry as prometheus.yml, different transport: in Azure, Prometheus
# and the API are separate Container Apps rather than compose services on one
# network, so the target is the API's real public hostname over HTTPS instead
# of the internal "api:3000".
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ipl-api
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ['ipl-api.icytree-bb74c5d4.centralindia.azurecontainerapps.io']
        labels:
          service: ipl-api
